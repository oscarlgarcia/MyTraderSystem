<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ cfg.env | upper }} Control Plane</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #13233a; }
      header { background: #13233a; color: #fff; padding: 1rem 1.5rem; }
      nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; }
      nav a { color: #d7e6ff; text-decoration: none; font-weight: 600; }
      main { padding: 1.5rem; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .card { background: #fff; border-radius: 14px; padding: 1rem; box-shadow: 0 10px 24px rgba(19,35,58,.08); }
      table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
      th, td { padding: 0.7rem; border-bottom: 1px solid #e4e8f0; text-align: left; vertical-align: top; }
      th { background: #edf2fb; }
      code, pre { font-family: Consolas, monospace; }
      .status-ok { color: #0d7a46; font-weight: 700; }
      .status-degraded, .status-failed { color: #b65000; font-weight: 700; }
      .status-open { color: #a80000; font-weight: 700; }
      .muted { color: #5d6c83; }
      form { display: grid; gap: 0.7rem; margin-top: 1rem; }
      input, select, button, textarea { padding: 0.6rem; border: 1px solid #c5d1e0; border-radius: 10px; font: inherit; }
      button { background: #153b6d; color: #fff; cursor: pointer; }
      .command-feedback { margin: 0.8rem 0; padding: 0.8rem 1rem; border-radius: 10px; }
      .command-feedback.success { background: #e7fff2; color: #11643b; }
      .json { white-space: pre-wrap; word-break: break-word; background: #0d1623; color: #dce7f8; padding: 1rem; border-radius: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div><strong>MyTraderSystem Control Plane</strong> · env={{ cfg.env }}</div>
      <nav>
        <a href="/ui/overview">Overview</a>
        <a href="/ui/runs">Runs</a>
        <a href="/ui/streams">Streams</a>
        <a href="/ui/alerts">Alerts</a>
        <a href="/ui/checkpoints">Checkpoints</a>
        <a href="/ui/recovery">Recovery</a>
        <a href="/ui/audit">Audit</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
